# Kenyan Sign Language Recognizer Configuration

project:
  name: "KSL Real-time Recognizer"
  version: "1.0.0"

# Default signs (start small, expand later)
signs:
  - hello
  - thank_you
  - "yes"
  - "no"
  - please
  - sorry
  - good
  - bad
  - help
  - love

# Data settings
data:
  sequence_length: 30          # frames per sequence
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  samples_per_sign: 50         # target samples to collect per sign

# Model settings
model:
  type: "lstm"                 # lstm | transformer
  input_dim: 1662              # MediaPipe Holistic: pose(33*4) + face(468*3) + left_hand(21*3) + right_hand(21*3) = 1662
  hidden_dim: 128
  num_layers: 2
  dropout: 0.3
  num_classes: 10

# Training
training:
  batch_size: 16
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.0001
  train_split: 0.8
  seed: 42

# Paths
paths:
  raw_data: "data/raw"
  landmarks: "data/landmarks"
  models: "models"
  processed: "data/processed"
